places(){return title('먹고, 쉬고, 둘러보고','이전 메모와 2025 계획에서 모은 장소 · 지도는 검색 링크입니다',add('places'))+`<div class="filters"><input id="search" aria-label="장소 검색" placeholder="식당 이름, 지역, 메뉴 검색" value="${esc(query)}">${['전체','식당','카페','마사지','관광','즐겨찾기'].map(t=>`<button data-filter="${t}" class="${filter===t?'selected':''}">${t}</button>`).join('')}</div><div id="results" class="grid">${placeResults()}</div>`},
routes(){return title('다시 달리고 싶은 길','계획 경로는 완주 기록이 아닙니다. 실제 기록은 주행일·표시 거리 기준. 상승고도와 개별 활동 지도는 추가 확인이 필요합니다.',add('routes'))+`<div class="filters"><input id="search" aria-label="코스 검색" placeholder="코스·연도 검색" value="${esc(query)}">${['전체','실제 주행','계획 경로','추천 후보','즐겨찾기'].map(t=>`<button data-filter="${t}" class="${filter===t?'selected':''}">${t}</button>`).join('')}</div><div id="results" class="grid">${routeResults()}</div>`},
days(){const d=data.days.find(d=>d.date===selectedDate)||data.days[0];selectedDate=d.date;return title('일정','항공·이동은 확정 정보, 나머지는 함께 수정할 초안입니다.')+`<div class="date-strip">${data.days.map(x=>`<button data-date="${x.date}" class="${x.date===d.date?'active':''}"><small>${x.date.slice(5,7)}월</small><strong>${x.date.slice(8)}</strong>${new Date(x.date+'T12:00:00').toLocaleDateString('ko-KR',{weekday:'short'})}</button>`).join('')}</div><div class="daylayout"><article class="card">${badge(d.status)}<h2>${esc(d.date)}</h2>${[['오전 · 라이딩',d.morning],['오후 · 휴식',d.afternoon],['저녁 · 식사',d.dinner]].map(([l,v])=>`<div class="schedule-row"><b>${l}</b><span>${esc(v||'미정')}</span></div>`).join('')}<p>${esc(d.note)}</p><div class="actions">${edit('days',d.id)}</div></article><article class="card"><span class="eyebrow">A GOOD DAY IN CHIANG MAI</span><h3>달리고, 먹고, 쉬는 리듬</h3><p>2025년 계획의 기본 흐름<br>06:00 기상·조식<br>07:00–12:00 라이딩<br>14:00–15:00 낮잠<br>16:00–21:00 관광·저녁<br>22:00 취침</p><p>올해 제안: 강한 라이딩 다음 날에는 회복 라이딩 또는 휴식. 코스와 저녁 식당은 숙소 위치를 보고 묶어 정합니다.</p><div class="actions"><button data-go="routes">코스</button><button data-go="places">식당·장소</button></div></article></div>`},
packing(){const n=data.packing.filter(p=>p.done).length;return title('준비물','이번 여행의 준비 상태 · 변경 내용 자동 저장',add('packing'))+`<div class="card"><div class="stats"><div><b>${n}</b><span>준비 완료</span></div><div><b>${data.packing.length-n}</b><span>남은 준비물</span></div></div><progress value="${n}" max="${data.packing.length}"></progress><div class="checklist">${data.packing.map(p=>`<label class="check ${p.done?'done':''}"><input type="checkbox" data-check="${esc(p.id)}" ${p.done?'checked':''}><span>${esc(p.name)}</span></label>`).join('')}</div></div>`},
notes(){return title('메모','논의할 내용과 참고 자료를 모아 둡니다.')+`<div class="grid two"><div class="card"><h3>메모</h3><label>메모<textarea id="notes" rows="15">${esc(data.notes)}</textarea></label><p>입력한 내용은 자동 저장됩니다. 동기화 상태는 상단에서 확인하세요.</p></div><div class="card"><h3>참고 자료</h3><div class="source-list">${data.sources.map(s=>ext(s.url,s.name)).join('')}</div><h3>아이폰에서 쉽게 열기</h3><p>Chrome 또는 Safari에서 로그인 후 공유 메뉴의 ‘홈 화면에 추가’를 선택하세요. 인터넷 연결과 본인 계정 로그인이 필요합니다.</p><h3>내 기록 보관</h3><p>상단 백업은 현재 내용을 JSON 파일로 내려받습니다. 다른 기기에서는 같은 주소로 접속하세요.</p></div></div>`}
};
function placeResults(){let arr=data.places.filter(p=>(filter==='전체'||(filter==='즐겨찾기'?p.favorite:p.kind===filter))&&JSON.stringify(p).toLowerCase().includes(query.toLowerCase()));return arr.map(p=>`<article class="card ${p.favorite?'saved-item':''}"><div>${badge(p.kind)} ${badge(p.area)}</div><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p><div class="label">${esc(p.source)}</div><div class="actions"><button data-fav="places" data-id="${esc(p.id)}" aria-label="${esc(p.name)} 즐겨찾기" aria-pressed="${!!p.favorite}" class="${p.favorite?'favorite':''}">${p.favorite?'★':'☆'}</button>${ext(p.url||map(p.name),'지도·정보')}<button data-visit="${esc(p.id)}">${p.visited?'✓ 방문함':'방문 체크'}</button>${edit('places',p.id)}</div></article>`).join('')||'<div class="empty">조건에 맞는 장소가 없습니다.</div>'}
function routeResults(){let arr=data.routes.filter(r=>(filter==='전체'||(filter==='즐겨찾기'?r.favorite:r.type===filter))&&JSON.stringify(r).toLowerCase().includes(query.toLowerCase()));return arr.map(r=>`<article class="card ${r.favorite?'saved-item':''}">${badge(r.type)} <span class="label">${esc(r.year)}</span><h3>${esc(r.name)}</h3><div class="route-stats"><div><strong>${esc(r.distance||'—')}</strong><small>거리 km</small></div><div><strong>${esc(r.elevation||'—')}</strong><small>상승고도 m</small></div></div><p>${esc(r.note)}</p><div class="actions"><button data-fav="routes" data-id="${esc(r.id)}" aria-label="${esc(r.name)} 즐겨찾기" aria-pressed="${!!r.favorite}">${r.favorite?'★':'☆'}</button>${ext(r.url,r.type==='실제 주행'?'훈련 로그 (개별 코스 아님)':'코스 원본')}${edit('routes',r.id)}</div></article>`).join('')||'<div class="empty">조건에 맞는 코스가 없습니다.</div>'}
const schemas={flights:[['name','편명'],['departure','출발 · 현지시각'],['arrival','도착 · 현지시각'],['reference','예약번호'],['url','원본 링크','url'],['note','메모','textarea']],hotels:[['name','숙소명'],['checkin','체크인','date'],['checkout','체크아웃','date'],['address','주소'],['reference','예약번호'],['url','예약 원본 링크','url'],['note','메모','textarea']],places:[['name','장소명'],['kind','분류','select','식당,카페,마사지,관광'],['area','지역'],['source','출처'],['url','지도 또는 공식 링크','url'],['note','메모','textarea']],routes:[['name','코스명'],['type','종류','select','계획 경로,실제 주행,추천 후보'],['year','연도 또는 주행일'],['distance','거리 km'],['elevation','상승고도 m'],['url','스트라바·코스 링크','url'],['note','메모','textarea']],days:[['morning','오전·라이딩'],['afternoon','오후·휴식'],['dinner','저녁·식사'],['status','상태','select','미정,제안,확정,항공 확정,이동 준비'],['note','메모','textarea']],packing:[['name','준비물']]};
function openEditor(type,id){const obj=id?data[type].find(x=>x.id===id):{};editContext={type,id};$('#dialogTitle').textContent=id?'여행 정보 수정':'여행 정보 추가';$('#fields').innerHTML=schemas[type].map(([key,label,kind,opts])=>`<label class="${kind==='textarea'?'full':''}">${label}${kind==='textarea'?`<textarea name="${key}">${esc(obj[key])}</textarea>`:kind==='select'?`<select name="${key}">${opts.split(',').map(o=>`<option ${obj[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${key}" type="${kind||'text'}" value="${esc(obj[key])}" ${key==='name'?'required':''}>`}</label>`).join('');$('#editor').showModal()}
$('#closeDialog').onclick=$('#cancelDialog').onclick=()=>$('#editor').close();$('#editForm').onsubmit=e=>{e.preventDefault();const {type,id}=editContext;const values=Object.fromEntries(new FormData(e.target).entries());if(type==='hotels'&&values.checkin&&values.checkout&&values.checkout<values.checkin){notify('체크아웃 날짜를 확인해 주세요.');return}if(id){Object.assign(data[type].find(x=>x.id===id),values)}else{data[type].push({id:crypto.randomUUID(),favorite:false,visited:false,done:false,...values})}changed();$('#editor').close();render()};
function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>openEditor(e.dataset.edit,e.dataset.id));document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>openEditor(e.dataset.add));document.querySelectorAll('[data-filter]').forEach(e=>e.onclick=()=>{filter=e.dataset.filter;render()});document.querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>{selectedDate=e.dataset.date;render();document.querySelector('.date-strip .active')?.scrollIntoView({block:'nearest',inline:'center'})});document.querySelectorAll('[data-fav]').forEach(e=>e.onclick=()=>{const r=data[e.dataset.fav].find(r=>r.id===e.dataset.id);r.favorite=!r.favorite;changed();render()});document.querySelectorAll('[data-visit]').forEach(e=>e.onclick=()=>{const p=data.places.find(p=>p.id===e.dataset.visit);p.visited=!p.visited;changed();render()});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{data.packing.find(p=>p.id===e.dataset.check).done=e.checked;changed();render()});if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#results').innerHTML=view==='places'?placeResults():routeResults();bindResults()};if($('#notes'))$('#notes').oninput=e=>{data.notes=e.target.value;changed()}}
function bindResults(){document.querySelectorAll('#results [data-edit]').forEach(e=>e.onclick=()=>openEditor(e.dataset.edit,e.dataset.id));document.querySelectorAll('#results [data-fav]').forEach(e=>e.onclick=()=>{const r=data[e.dataset.fav].find(r=>r.id===e.dataset.id);r.favorite=!r.favorite;changed();render()});document.querySelectorAll('#results [data-visit]').forEach(e=>e.onclick=()=>{const p=data.places.find(p=>p.id===e.dataset.visit);p.visited=!p.visited;changed();render()})}
const dayColors={'라이딩':'ride','회복':'recovery','휴식':'rest','이동':'travel'};
function dayLabel(d){return d.rideKind==='라이딩'?(d.intensity==='최고강도'?'55 고강도':'라이딩'):d.rideKind==='회복'?(d.calendarLabel==='적응'?'적응':'회복'):d.rideKind==='휴식'?'휴식':d.calendarLabel||d.rideKind||'미정';}
function calendar(){
 const months=[...new Set(data.days.map(d=>d.date.slice(0,7)))];
 return '<div class="calendar-months">'+months.map(month=>{
  const first=new Date(month+'-01T12:00:00Z'),offset=(first.getUTCDay()+6)%7;
  const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
  return `<section class="card month"><h2>${esc(month.replace('-','년 '))}월</h2><div class="calendar-grid">${['월','화','수','목','금','토','일'].map(n=>`<span class="weekday">${n}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:last},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0'),d=data.days.find(x=>x.date===date);return d?`<button data-date="${date}" class="calendar-day ${dayColors[d.rideKind]||''} ${d.rideKind==='라이딩'&&d.intensity==='최고강도'?'high-intensity':''} ${selectedDate===date?'chosen':''}" aria-label="${date} ${esc(d.rideKind)} ${esc(d.goal)} ${esc(d.morning)}" aria-pressed="${selectedDate===date}"><b>${i+1}</b><span>${esc(d.rideKind==='라이딩'&&d.intensity==='최고강도'?'55':dayLabel(d))}</span><small>${esc(d.goal||'—')}</small></button>`:`<span class="outside">${i+1}</span>`}).join('')}</div></section>`;
 }).join('')+'</div>';
}
views.days=function(){const d=data.days.find(x=>x.date===selectedDate)||data.days[0];if(!d)return title('여행 캘린더','일정 데이터를 불러와 주세요.');selectedDate=d.date;const r=data.routes.find(r=>r.id===d.routeId);return title('일정','날짜별 라이딩·휴식 일정 · 거리 단위 km')+`<p class="schedule-rule">${esc(data.trip.scheduleRule||'날짜를 눌러 라이딩과 휴식 계획을 편집하세요.')}</p><div class="legend">${Object.entries(dayColors).map(([name,cls])=>`<span class="${cls}">${name} ${data.days.filter(x=>x.rideKind===name).length}일</span>`).join('')}</div>${calendar()}<div class="notice">거리는 계획 목표입니다. 실제 경로의 거리·상승고도는 출발 전 확인하고, 컨디션이 나쁘면 휴식으로 바꾸세요.</div><article class="card" id="day-detail"><div class="section-head"><h2>${esc(d.date)} · ${esc(dayLabel(d))}</h2>${edit('days',d.id)}</div>${badge(d.status)} ${d.goal?badge('목표 '+d.goal+' km'):''}${[['오전',d.morning],['오후',d.afternoon],['저녁',d.dinner]].map(([k,v])=>`<div class="schedule-row"><b>${k}</b><span>${esc(v||'미정')}</span></div>`).join('')}<p>${esc(d.note)}</p><div class="actions">${r&&/^https:\/\/www.strava.com\/routes\//.test(r.url)?ext(r.url,r.name+' · Strava 코스'):(d.rideKind==='라이딩'?'<span class="accent">연결된 코스 없음</span>':'')}<button data-go="routes">전체 코스</button><button data-go="places">식당·장소</button></div></article>`};

const bangkokDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

function analyzeTrack(segments){
 if(!Array.isArray(segments)||!segments.length)throw Error('경로 좌표가 없습니다.');
 const valid=segments.filter(s=>Array.isArray(s)&&s.length>=2);if(valid.length>50)throw Error('경로 구간이 너무 많습니다. 하나의 코스 파일을 선택하세요.');let total=0,gain=0,elevationCount=0,pointCount=0,min=Infinity,max=-Infinity;const profile=[],geometry=[];
 const distance=(a,b)=>{const rad=Math.PI/180;const lat=(b[0]-a[0])*rad,lon=(b[1]-a[1])*rad;const h=Math.sin(lat/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(lon/2)**2;return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(Math.max(0,1-h)));};
 const totalPoints=valid.reduce((n,s)=>n+s.length,0);if(totalPoints<2||totalPoints>150000)throw Error('경로 좌표 수를 확인해 주세요.');
 for(const segment of valid){let prev=null;const sample=[],step=Math.max(1,Math.ceil(segment.length/Math.max(2,Math.floor(1000*segment.length/totalPoints))));
  for(let i=0;i<segment.length;i++){const p=segment[i];if(!Array.isArray(p)||!Number.isFinite(p[0])||!Number.isFinite(p[1])||Math.abs(p[0])>90||Math.abs(p[1])>180)throw Error('올바르지 않은 경로 좌표입니다.');
   if(prev)total+=distance(prev,p);pointCount++;if(Number.isFinite(p[2])){elevationCount++;min=Math.min(min,p[2]);max=Math.max(max,p[2]);if(prev&&Number.isFinite(prev[2]))gain+=Math.max(0,p[2]-prev[2]);profile.push([Math.round(total)/1000,Math.round(p[2])]);}
   if(i%step===0||i===segment.length-1)sample.push([+p[0].toFixed(6),+p[1].toFixed(6)]);prev=p;
  }geometry.push(sample);
 }
 const profileStep=Math.max(1,Math.ceil(profile.length/350));return {distance:(total/1000).toFixed(1),elevation:elevationCount===pointCount?String(Math.round(gain)):'',minElevation:elevationCount?Math.round(min):null,maxElevation:elevationCount?Math.round(max):null,geometry,profile:profile.filter((_,i)=>i%profileStep===0||i===profile.length-1),elevationComplete:elevationCount===pointCount};
}
function parseGpx(text){

 const point=p=>{const lat=p.getAttribute('lat'),lon=p.getAttribute('lon'),ele=by(p,'ele')[0]?.textContent?.trim();return [lat===null||!lat.trim()?NaN:Number(lat),lon===null||!lon.trim()?NaN:Number(lon),ele?Number(ele):null];};
 let segments=by(xml,'trkseg').map(s=>by(s,'trkpt').map(point));if(!segments.length)segments=by(xml,'rte').map(s=>by(s,'rtept').map(point));

}

function applyStayUpdate(state,p){

 for(const b of p.bookings){const matches=state.hotels.filter(h=>typeof b.reference==='string'&&String(h.reference||'').split(/[^A-Za-z0-9]+/).includes(b.reference)&&h.checkin===b.checkin&&h.checkout===b.checkout);if(matches.length!==1||ids.includes(matches[0].id))throw Error('현재 숙소 예약과 확인 메일의 예약번호·기간이 일치하지 않습니다. 기존 데이터는 그대로 유지했습니다.');ids.push(matches[0].id);}

const copyState=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));
const plain=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function mergeTravelState(base,local,remote,preference){
 const conflicts=[];
 const merge=(b,l,r,path)=>{
  if(equal(l,b))return copyState(r);if(equal(r,b)||equal(l,r))return copyState(l);
  if(plain(b)&&plain(l)&&plain(r)){const out={};for(const key of new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)])){if(['__proto__','constructor','prototype'].includes(key))continue;const v=merge(b[key],l[key],r[key],path.concat(key));if(v!==undefined)out[key]=v;}return out;}
  if([b,l,r].every(a=>Array.isArray(a)&&a.every(x=>plain(x)&&typeof x.id==='string')&&new Set(a.map(x=>x.id)).size===a.length)){
   const maps=[b,l,r].map(a=>new Map(a.map(x=>[x.id,x]))),ids=new Set([...r,...l,...b].map(x=>x.id)),out=[];
   for(const id of ids){const v=merge(...maps.map(m=>m.get(id)),path.concat(id));if(v!==undefined)out.push(v);}return out;
  }
  conflicts.push({path,local:copyState(l),remote:copyState(r)});return copyState(preference==='remote'?r:l);

function courseCategory(r){

function suggestCourseCategory(r){

  if(/rose\s*garden/i.test(name))return {category:'산악 중장거리',reason:'코스명에 나온 로즈가든의 산악 접근로를 기준으로 임시 분류했습니다. 실제 주행 경로·고도는 확인이 필요합니다.'};

  return {category:'평지 중장거리',reason:'주행 기록을 목록에서 바로 찾을 수 있도록 평지에 임시 배치했습니다. 지형이 확인된 것은 아니며, 실제 경로·고도 확인 후 카테고리를 바꿀 수 있습니다.'};

}
function courseCategoryNote(r){

function placeMeta(p){const norm=s=>String(s).toLowerCase().replace(/[\s\-’']/g,'');const found=PLACE_CATALOG.find(c=>c.names.some(n=>norm(n)===norm(p.name)));return {query:p.mapQuery||found?.query||p.name+' Chiang Mai Thailand',image:p.imageUrl||found?.image||'',source:p.imageSource||found?.source||'',credit:p.imageUrl?'등록 사진':found?.credit||''};}

// Shared UI helpers are bundled into the authenticated HTML.
const shortDate=t=>{const m=String(t||'').match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})/);return m?{date:Number(m[2])+'월 '+Number(m[3])+'일',time:m[4]}:{date:String(t||''),time:'—'};};
const photoPlaceholder='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="10" width="36" height="28" rx="6"/><circle cx="17" cy="20" r="3"/><path d="m9 35 10-10 7 7 7-9 7 12"/></svg>';
const previewMap=(q,name)=>`<iframe class="place-map" title="${esc(name)} Google 지도" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" src="https://www.google.com/maps?q=${encodeURIComponent(q)}&amp;output=embed&amp;hl=ko" allowfullscreen></iframe>`;
const googleLink=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const directionLink=q=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q);
const external=(url,label)=>safe(url)?`<a href="${safe(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'';
flightCard=f=>{const departure=shortDate(f.departure),arrival=shortDate(f.arrival),seat=seatNumber(f),pieces=(f.baggagePieces===''?null:f.baggagePieces)??(/대한항공|\bKE\s*\d/i.test(f.name)?2:null);return `<article class="card flight-card"><div class="meta-row">${badge(f.name)}${f.membership?badge(f.membership):''}</div><div class="flight-leg"><div><div class="airport">${/ICN/.test(f.departure)?'ICN':/CNX/.test(f.departure)?'CNX':'출발'}</div><span class="time">${esc(departure.time)}</span><span class="date">${esc(departure.date)}</span></div><span class="line" aria-hidden="true">✈</span><div><div class="airport">${/ICN/.test(f.arrival)?'ICN':/CNX/.test(f.arrival)?'CNX':'도착'}</div><span class="time">${esc(arrival.time)}</span><span class="date">${esc(arrival.date)}</span></div></div><div class="flight-details"><div><small>좌석</small><strong>${esc(seat||'예약 완료')}</strong>${seat?'':'<p class="flight-hint">좌석번호 미등록</p>'}</div><div><small>무료 위탁 수하물</small><strong>${pieces==null?'정보 없음':esc(pieces)+'개'}</strong><p class="flight-hint">${esc(f.membership||(/대한항공|\bKE\s*\d/i.test(f.name)?'모닝캄 적용':'예약 기준'))}</p></div></div><details><summary>예약번호</summary><b>${esc(f.reference)}</b></details>${f.note?`<p class="flight-note">${esc(f.note)}</p>`:''}<div class="actions">${external(f.url,'예약 내역')}${edit('flights',f.id)}</div></article>`;};
views.flights=()=>title('항공권','출도착 시간은 현지 기준입니다.')+`<div class="grid two">${data.flights.map(flightCard).join('')}</div><p class="message">위탁 수하물 2개 · 모닝캄 혜택 반영. 개당 허용 중량과 자전거 포장 규정은 예약 내역에서 확인하세요.</p>`;
views.places=()=>title('식당·장소','사진 · Google 지도 · 길찾기',add('places'))+`<div class="filters"><input id="search" aria-label="장소 검색" placeholder="이름, 지역, 메뉴 검색" value="${esc(query)}">${['전체','식당','카페','마사지','관광','즐겨찾기'].map(t=>`<button data-filter="${t}" class="${filter===t?'selected':''}">${t}</button>`).join('')}</div><div id="results" class="grid">${placeResults()}</div>`;
placeResults=function(){const arr=data.places.filter(p=>(filter==='전체'||(filter==='즐겨찾기'?p.favorite:p.kind===filter))&&JSON.stringify(p).toLowerCase().includes(query.toLowerCase()));return arr.map(p=>{const m=placeMeta(p);return `<article class="card photo-card ${p.favorite?'saved-item':''}"><div class="photo-cover"><div class="photo-empty">${photoPlaceholder}<span>${safe(m.image)?'사진 불러오기':'사진 미등록'}</span></div>${safe(m.image)?`<img src="${safe(m.image)}" alt="${esc(p.name)} 사진" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:''}<span class="photo-tag">${esc(p.kind)}</span></div><div class="photo-body"><div class="meta-row">${p.area&&p.area!=='위치 확인'?badge(p.area):''}${p.visited?badge('방문 완료'):''}</div><h3>${esc(p.name)}</h3><p class="description">${esc(p.note)}</p><div class="actions"><button class="icon-action" data-fav="places" data-id="${esc(p.id)}" aria-label="${esc(p.name)} 즐겨찾기" aria-pressed="${!!p.favorite}">${p.favorite?'★':'☆'}</button>${external(googleLink(m.query),'Google 지도')}${external(directionLink(m.query),'길찾기')}<button data-visit="${esc(p.id)}">${p.visited?'방문 완료':'방문 기록'}</button>${edit('places',p.id)}</div><details class="map-toggle" data-place-map="${esc(p.id)}"><summary>지도 미리보기</summary><div class="map-slot"></div><p class="map-caption">장소명 검색 지도 · 정확한 지점은 Google 지도에서 확인</p></details>${safe(m.source)?`<a class="photo-credit" href="${safe(m.source)}" target="_blank" rel="noopener noreferrer">사진 출처 · ${esc(m.credit)}</a>`:''}</div></article>`;}).join('')||'<div class="empty">검색 결과가 없습니다.</div>';};
views.routes=()=>title('라이딩 코스','코스 지도 · 거리 · 획득고도',add('routes'))+`<div class="filters"><input id="search" aria-label="코스 검색" placeholder="코스명, 연도 검색" value="${esc(query)}">${['전체','실제 주행','계획 경로','추천 후보','즐겨찾기'].map(t=>`<button data-filter="${t}" class="${filter===t?'selected':''}">${t}</button>`).join('')}</div><div id="results" class="grid">${routeResults()}</div><p class="message">공개 Strava 코스는 상세 화면에서 지도와 고도표를 표시합니다. 비공개 코스·주행 기록은 GPX 파일로 거리와 획득고도를 계산할 수 있습니다.</p>`;
routeResults=function(){const arr=data.routes.filter(r=>(filter==='전체'||(filter==='즐겨찾기'?r.favorite:r.type===filter))&&JSON.stringify(r).toLowerCase().includes(query.toLowerCase()));return arr.map(r=>`<article class="card route-card ${r.favorite?'saved-item':''}"><div class="meta-row">${badge(r.type)}<span class="label">${esc(r.year)}</span></div><h3>${esc(r.name)}</h3><div class="route-stats"><div><strong class="${r.distance?'':'stat-missing'}">${esc(r.distance||'미등록')}</strong><small>거리 · km</small></div><div><strong class="${r.elevation!==''&&r.elevation!=null?'':'stat-missing'}">${esc(r.elevation!==''&&r.elevation!=null?r.elevation:'미등록')}</strong><small>획득고도 · m</small></div></div>${r.metricSource?`<span class="label">${esc(r.metricSource)}</span>`:''}<p class="description">${esc(r.note)}</p><div class="actions"><button class="primary" data-route-detail="${esc(r.id)}">코스 상세</button><button data-gpx="${esc(r.id)}">GPX 등록</button><button class="icon-action" data-fav="routes" data-id="${esc(r.id)}" aria-label="${esc(r.name)} 즐겨찾기" aria-pressed="${!!r.favorite}">${r.favorite?'★':'☆'}</button>${edit('routes',r.id)}</div></article>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>';};
function trackSvg(r){const segs=(r.geometry||[]).map(s=>s.filter(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1]))).filter(s=>s.length>1);const pts=segs.flat();if(!pts.length)return '';const minLat=Math.min(...pts.map(p=>p[0])),maxLat=Math.max(...pts.map(p=>p[0])),minLon=Math.min(...pts.map(p=>p[1])),maxLon=Math.max(...pts.map(p=>p[1])),cos=Math.cos((minLat+maxLat)/2*Math.PI/180);const w=Math.max((maxLon-minLon)*cos,.00001),h=Math.max(maxLat-minLat,.00001),scale=Math.min(560/w,280/h),cx=(minLon+maxLon)/2,cy=(minLat+maxLat)/2;const xy=p=>[300+(p[1]-cx)*cos*scale,160-(p[0]-cy)*scale];const a=xy(pts[0]),b=xy(pts.at(-1));return `<svg class="route-visual" viewBox="0 0 600 320" role="img" aria-label="${esc(r.name)} GPX 경로 개요"><path d="M0 80H600M0 160H600M0 240H600M150 0V320M300 0V320M450 0V320" stroke="#dce6dc"/>${segs.map(s=>`<polyline points="${s.map(p=>xy(p).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#246748" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}<circle cx="${a[0]}" cy="${a[1]}" r="7" fill="#84b957" stroke="white" stroke-width="3"/><circle cx="${b[0]}" cy="${b[1]}" r="5" fill="#d08b36" stroke="white" stroke-width="2"/><text x="20" y="25" fill="#596b63" font-size="13">N ↑</text></svg><p class="map-caption">GPX 경로 개요 · 북쪽 기준 · 도로 배경 없음</p>`;}
function profileSvg(r){const points=(r.profile||[]).filter(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1]));if(points.length<2)return '';const lo=Math.min(...points.map(p=>p[1])),hi=Math.max(...points.map(p=>p[1])),dist=Math.max(...points.map(p=>p[0]),.001);const coords=points.map(p=>[(p[0]/dist*560+20).toFixed(1),(145-(p[1]-lo)/Math.max(hi-lo,1)*105).toFixed(1)].join(','));return `<svg class="route-profile" viewBox="0 0 600 180" role="img" aria-label="GPX 고도표"><polygon points="20,145 ${coords.join(' ')} 580,145" fill="#c9dfbd"/><polyline points="${coords.join(' ')}" fill="none" stroke="#547d45" stroke-width="2"/><text x="20" y="20" fill="#596b63" font-size="13">${Math.round(hi)} m</text><text x="20" y="165" fill="#596b63" font-size="13">0 km · 최저 ${Math.round(lo)} m</text><text x="580" y="165" text-anchor="end" fill="#596b63" font-size="13">${dist.toFixed(1)} km</text></svg>`;}
function showRoute(id){const r=data.routes.find(x=>x.id===id);if(!r)return;const identity=routeIdentity(r.url);const start=r.geometry?.[0]?.[0];const diagram=trackSvg(r);$('#routeTitle').textContent=r.name;$('#routeBody').innerHTML=`<div class="meta-row">${badge(r.type)}${badge(r.year)}</div><div class="route-summary"><div><small>거리</small><b>${r.distance?esc(r.distance)+' km':'미등록'}</b></div><div><small>획득고도</small><b>${r.elevation!==''&&r.elevation!=null?esc(r.elevation)+' m':'미등록'}</b></div></div>${diagram}${profileSvg(r)}${identity?`<h3>Strava 지도·고도표</h3><iframe class="route-frame" src="https://strava-embeds.com/${identity.type}/${identity.id}?style=standard&amp;fromEmbed=true" title="${esc(r.name)} Strava 상세" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen" allowfullscreen></iframe><p class="map-caption">Strava 공개 설정에 따라 표시됩니다. 표시되지 않으면 아래 Strava 버튼으로 확인하세요.</p>`:(!diagram?'<div class="notice">연결된 개별 코스가 없습니다. GPX 등록 또는 코스 링크 수정 후 상세정보를 표시할 수 있습니다.</div>':'')}${start?`<details class="map-toggle"><summary>출발지 지도</summary>${previewMap(start.join(','),'출발지')}</details>`:''}<p>${esc(r.note)}</p>${r.metricSource?`<p class="map-caption">${esc(r.metricSource)} · 고도 보정과 GPS 오차로 기기 수치와 차이가 있을 수 있습니다.${r.elevationComplete===false?' 고도 정보가 누락되어 획득고도를 표시하지 않습니다.':''}</p>`:''}<div class="actions">${external(r.url,identity?'Strava':'훈련 로그')}<button data-gpx="${esc(id)}">GPX 등록</button><button data-route-edit="${esc(id)}">정보 수정</button></div>`;bindMedia();$('#routeDialog').showModal();}
let gpxRouteId=null;
function chooseGpx(id){gpxRouteId=id;$('#gpxFile').click();}
$('#gpxFile').onchange=async e=>{const file=e.target.files[0],id=gpxRouteId;if(!file||!id)return;try{if(file.size>12000000)throw Error('12MB 이하의 GPX 파일을 선택하세요.');const result=parseGpx(await file.text());const route=data.routes.find(r=>r.id===id);if(!route)throw Error('코스를 찾을 수 없습니다.');Object.assign(route,result,{gpxFileName:file.name});changed();render();if($('#routeDialog').open){$('#routeDialog').close();showRoute(id);}notify('GPX 분석 완료 · 자동 저장 중입니다.');}catch(err){notify(err.message);}finally{e.target.value='';gpxRouteId=null;}};
$('#closeRoute').onclick=()=>{$('#routeDialog').close();$('#routeBody').innerHTML='';};
function openMore(){const extra=pages.filter(p=>['flights','hotels','packing','notes'].includes(p[0]));$('#moreBody').innerHTML=`<div class="more-grid">${extra.map(([v,i,n])=>`<button data-more-go="${v}"><span>${i}</span>${n}</button>`).join('')}</div><details class="phone-shortcut"><summary>휴대폰에서 바로 열기</summary><p>이 여행 페이지에서 브라우저 공유 메뉴의 ‘홈 화면에 추가’를 선택하세요. 이후 같은 아이콘으로 열면 됩니다.</p><p>로그인이 필요하면 같은 화면에서 로그인해 주세요. 저장하지 못한 수정은 이 기기에 보관합니다.</p></details><div class="more-tools"><button id="mobileBackup">데이터 백업</button><button id="mobileImport">데이터 가져오기</button></div>`;document.querySelectorAll('[data-more-go]').forEach(b=>b.onclick=()=>{$('#moreDialog').close();go(b.dataset.moreGo);});$('#mobileBackup').onclick=()=>$('#exportBtn').click();$('#mobileImport').onclick=()=>{$('#moreDialog').close();$('#importFile').click();};$('#moreDialog').showModal();}
$('#closeMore').onclick=()=>$('#moreDialog').close();$('#moreBtn').onclick=openMore;

function discoveryAvailability(item,date,clock){
 const weekday=new Date(date+'T12:00:00Z').getUTCDay();
 if(item.closedDates?.includes(date.slice(5)))return '휴관일';
 if(item.closedWeekdays?.includes(weekday))return '정기 휴무';
 if(item.weekdays&&!item.weekdays.includes(weekday))return '수요일 오전 운영';
 if(clock?.date===date&&clock.hour>=item.closes)return '오늘 운영 종료';
 return '';
}
function discoveryIsKnown(state,item){
 if(state.discoveryLog?.[item.id]?.visited||state.discoveryLog?.[item.id]?.known)return true;
 const normalize=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
 return state.places.some(p=>p.visited&&[item.place,item.name].some(n=>normalize(n)===normalize(p.name)));
}
function discoveryRecommendations(state,day,clock){
 const quiet=day.rideKind==='라이딩'||day.intensity==='최고강도';

// Private data is stored only in the current browser/app. The public shell has no seed.
let ridebookDatabase;
function openRidebookDatabase(){
 if(ridebookDatabase)return ridebookDatabase;
 ridebookDatabase=new Promise((resolve,reject)=>{
  if(typeof indexedDB==='undefined'){reject(Error('이 브라우저에서 기기 저장을 사용할 수 없습니다.'));return;}
  const request=indexedDB.open('ridebook-private-v1',1);
  request.onupgradeneeded=()=>{request.result.createObjectStore('records');};
  request.onerror=()=>reject(Error('기기 저장 공간을 열지 못했습니다.'));
  request.onblocked=()=>reject(Error('다른 여행 앱 창을 닫고 다시 열어 주세요.'));
  request.onsuccess=()=>{const db=request.result;db.onversionchange=()=>{db.close();ridebookDatabase=null;};resolve(db);};
 }).catch(e=>{ridebookDatabase=null;throw e;});return ridebookDatabase;
}
async function readRidebookRecord(){
 const db=await openRidebookDatabase();return new Promise((resolve,reject)=>{const tx=db.transaction('records','readonly'),request=tx.objectStore('records').get('trip');let value;request.onsuccess=()=>{value=request.result||null;};tx.oncomplete=()=>resolve(value);tx.onerror=tx.onabort=()=>reject(Error('저장된 여행을 읽지 못했습니다.'));});
}
async function commitRidebookRecord(state,expectedRevision){
 const snapshot=JSON.parse(JSON.stringify(state));const db=await openRidebookDatabase();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('records','readwrite'),store=tx.objectStore('records'),request=store.get('trip');let result;
  request.onsuccess=()=>{const current=request.result||null;if((current?.revision||0)!==expectedRevision){result={ok:false,record:current};return;}const record={revision:expectedRevision+1,data:snapshot,updatedAt:new Date().toISOString()};store.put(record,'trip');result={ok:true,record};};
  tx.oncomplete=()=>resolve(result);tx.onerror=tx.onabort=()=>reject(Error('기기 저장에 실패했습니다. 저장 공간을 확인하고 현재 내용을 백업해 주세요.'));
 });
}
function createLocalTrip(start,end,title='나의 여행'){
 const check=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;
 if(!check(start)||!check(end)||end<start)throw Error('여행 시작일과 종료일을 확인해 주세요.');
 const count=Math.round((Date.parse(end)-Date.parse(start))/86400000)+1;if(count>90)throw Error('한 여행은 90일 이내로 설정해 주세요.');
 return {trip:{title,start,end,note:''},notes:'',sources:[],flights:[],hotels:[],places:[],routes:[],packing:[],days:Array.from({length:count},(_,i)=>{const date=new Date(Date.parse(start)+i*86400000).toISOString().slice(0,10);return {id:date,date,rideKind:'휴식',status:'미정',morning:'',afternoon:'',dinner:'',note:''};})};
}

// This entry point uses device storage only.
let localBase=null,localRevision=0,localSaveTimer,localSavePromise,localConflict=null,draftAvailable=true;
const draftKey='ridebook-private-draft-v1',transferKey='ridebook-transfer-v1';
let localReady=false,pwaWaiting=null,installPrompt=null;
function rememberLocalDraft(){if(!data)return;try{localStorage.setItem(draftKey,JSON.stringify({data,base:localBase,revision:localRevision}));draftAvailable=true;}catch{draftAvailable=false;}}
function localMessage(message){$('#syncNotice').hidden=false;$('#syncNotice').innerHTML=`<div><strong>기기 저장 확인</strong><p>${esc(message)}</p></div><div class="actions"><button id="retryLocal">저장 재시도</button><button id="backupLocal">백업</button></div>`;$('#retryLocal').onclick=()=>localReady?save():load();$('#backupLocal').onclick=()=>$('#exportBtn').click();}
changed=function(){dirty=true;rememberLocalDraft();$('#saveState').textContent='기기에 저장 중';clearTimeout(localSaveTimer);localSaveTimer=setTimeout(()=>save(),200);};
function migrateLocal(){normalizeFlights(data);normalizeCourses(data);addRecoveryCourses(data);}
load=async function(){
 try{
  const record=await readRidebookRecord();localRevision=record?.revision||0;localBase=record?.data?copyState(record.data):null;data=record?.data||null;localReady=true;
  let draft;try{draft=JSON.parse(localStorage.getItem(draftKey)||'null');}catch{}
  if(draft?.data&&validState(draft.data)){
   if(!data){data=draft.data;dirty=true;}
   else{const m=mergeTravelState(draft.base,draft.data,data);if(m.conflicts.length)localConflict={base:draft.base,remote:copyState(data),revision:localRevision};data=m.state;dirty=JSON.stringify(data)!==JSON.stringify(localBase);}
  }
  if(data&&!validState(data))throw Error('저장된 여행의 형식을 확인하지 못했습니다. 백업을 불러와 주세요.');
  if(data){migrateLocal();dirty=dirty||JSON.stringify(data)!==JSON.stringify(localBase);render();if(localConflict){showLocalConflict();}else if(dirty)await save();else $('#saveState').textContent='기기 저장 완료';}
  else showLocalWelcome();
  const transfer=readTransfer();if(transfer)offerTransfer(transfer);
 }catch(error){$('#saveState').textContent='저장 확인';localMessage(error.message);if(!data)showLocalWelcome();}
};
function showLocalWelcome(){
 $('#nav').innerHTML='';$('#saveState').textContent=localReady?'기기 저장 준비':'저장 확인';$('#content').innerHTML=`<section class="journey-hero"><div class="journey-heading"><span class="eyebrow">WEB + APP</span><h1>치앙마이,<br>나의 속도로.</h1><p>로그인 없이 열고, 여행은 내 기기에.</p></div></section><section class="card local-welcome"><h2>기존 여행을 가져오세요</h2><p>일정·코스·예약·메모가 들어 있는 백업 파일을 한 번 선택하면, 다음부터 바로 열립니다.</p><div class="actions"><button id="welcomeImport" class="primary">백업 파일 가져오기</button><a href="/travel#app-transfer">기존 사이트에서 옮기기</a></div><p class="section-intro">기존 사이트에서 옮길 때만 기존 로그인이 필요합니다. 이 앱에서 읽고 수정할 때는 필요하지 않습니다.</p><details><summary>빈 여행으로 시작</summary><form id="newTripForm"><label>여행 이름<input id="newTripName" value="나의 여행" required></label><div class="formgrid"><label>시작일<input id="newTripStart" type="date" required></label><label>종료일<input id="newTripEnd" type="date" required></label></div><button type="submit" class="primary">여행 만들기</button></form></details></section><section class="card local-welcome"><h2>휴대폰에서는 홈 화면에</h2><p>iPhone: Safari의 공유 메뉴에서 ‘홈 화면에 추가’를 선택하세요. Android: 브라우저 메뉴에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 선택하세요.</p><p>최초 온라인 실행 후 ‘오프라인 준비 완료’를 확인하세요. 지도·외부 사진·Strava는 인터넷이 필요합니다.</p></section>`;
 $('#welcomeImport').onclick=()=>$('#importFile').click();$('#newTripForm').onsubmit=async e=>{e.preventDefault();try{const state=createLocalTrip($('#newTripStart').value,$('#newTripEnd').value,$('#newTripName').value);if(!localReady)throw Error('기기 저장을 사용할 수 없습니다. 브라우저 저장 설정을 확인해 주세요.');if(data&&!confirm('현재 내용을 빈 여행으로 바꿀까요?'))return;data=state;migrateLocal();changed();if(await save())render();}catch(e){notify(e.message);}};
}
function readTransfer(){try{const p=JSON.parse(localStorage.getItem(transferKey)||'null');return p&&validState(p.data)?p:null;}catch{return null;}}
function offerTransfer(transfer){$('#syncNotice').hidden=false;$('#syncNotice').innerHTML=`<div><strong>기존 여행을 옮길 준비가 됐어요</strong><p>${esc(transfer.data.trip.start)} — ${esc(transfer.data.trip.end)} · 코스 ${transfer.data.routes.length}개</p><p>${data?'현재 기기 여행을 백업한 뒤 가져오세요.':'가져오면 이 기기에서 로그인 없이 사용할 수 있어요.'}</p></div><div class="actions"><button id="acceptTransfer">이 여행 가져오기</button><button id="dismissTransfer">나중에</button></div>`;$('#acceptTransfer').onclick=async()=>{if(data&&!confirm('현재 기기의 여행을 바꿉니다. 필요한 내용은 백업했나요?'))return;try{await importLocalState(transfer.data);localStorage.removeItem(transferKey);}catch(e){localMessage(e.message);}};$('#dismissTransfer').onclick=()=>{$('#syncNotice').hidden=true;};}
async function importLocalState(incoming){
 if(!validState(incoming))throw Error('여행 백업 형식이 아닙니다.');if(!localReady)throw Error('기기 저장을 사용할 수 없습니다.');
 // Rebase an explicit whole-backup replacement on the latest local revision.
 clearTimeout(localSaveTimer);if(localSavePromise)await localSavePromise;clearTimeout(localSaveTimer);const latest=await readRidebookRecord();localBase=latest?.data||null;localRevision=latest?.revision||0;localConflict=null;
 data=copyState(incoming);migrateLocal();changed();render();if(!await save())throw Error('가져온 내용이 아직 저장되지 않았습니다. 백업 원본을 보관하고 재시도하세요.');
}
function showLocalConflict(){localMessage('다른 앱 창에서도 같은 내용을 수정했습니다. 저장할 내용을 비교해 주세요.');$('#retryLocal').textContent='변경 내용 비교';$('#retryLocal').onclick=()=>{const m=mergeTravelState(localConflict.base,data,localConflict.remote);$('#conflictItems').innerHTML=m.conflicts.map(x=>`<li><b>${esc(x.path.join(' · '))}</b><p>현재 창: ${esc(JSON.stringify(x.local))}</p><p>저장된 내용: ${esc(JSON.stringify(x.remote))}</p></li>`).join('');$('#syncConflictDialog').showModal();};}
async function chooseLocalConflict(preference){if(!localConflict)return;data=mergeTravelState(localConflict.base,data,localConflict.remote,preference).state;localBase=copyState(localConflict.remote);localRevision=localConflict.revision;localConflict=null;$('#syncConflictDialog').close();changed();render();await save();}
save=function(){if(localSavePromise)return localSavePromise;clearTimeout(localSaveTimer);localSavePromise=saveLocalPending().finally(()=>{localSavePromise=null;if(dirty&&!localConflict&&localLastSaveOK)changed();});return localSavePromise;};
let localLastSaveOK=false;
async function saveLocalPending(){
 localLastSaveOK=false;if(!data||!localReady)return false;if(localConflict){showLocalConflict();return false;}if(!dirty)return true;
 $('#saveBtn').disabled=true;
 try{for(let attempt=0;attempt<3;attempt++){
  const snapshot=copyState(data),text=JSON.stringify(snapshot);if(new TextEncoder().encode(text).length>1000000)throw Error('여행 백업은 1MB 이내로 보관해 주세요.');if(!validState(snapshot))throw Error('여행 데이터 형식을 확인해 주세요.');
  const result=await commitRidebookRecord(snapshot,localRevision);
  if(!result.ok){const remote=result.record?.data||null,m=mergeTravelState(localBase,data,remote);if(m.conflicts.length){localConflict={base:localBase,remote,revision:result.record?.revision||0};showLocalConflict();return false;}data=m.state;localBase=copyState(remote);localRevision=result.record?.revision||0;rememberLocalDraft();continue;}
  localBase=snapshot;localRevision=result.record.revision;dirty=JSON.stringify(data)!==text;localLastSaveOK=true;$('#saveState').textContent=dirty?'기기에 저장 중':'기기 저장 완료';$('#syncNotice').hidden=true;
  if(dirty)rememberLocalDraft();else try{localStorage.removeItem(draftKey);}catch{}return true;
 }throw Error('다른 창의 저장이 진행 중입니다. 잠시 후 다시 저장해 주세요.');}
 catch(e){rememberLocalDraft();$('#saveState').textContent='저장 재시도';localMessage(e.message);return false;}
 finally{$('#saveBtn').disabled=false;}
}
$('#saveBtn').onclick=save;$('#keepLocal').onclick=()=>chooseLocalConflict('local');$('#keepRemote').onclick=()=>chooseLocalConflict('remote');$('#closeSyncConflict').onclick=()=>$('#syncConflictDialog').close();
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('1MB 이하의 백업 파일을 선택하세요.');const incoming=JSON.parse(await file.text());if(!validState(incoming))throw Error('여행 백업 형식이 아닙니다.');if(data&&!confirm('현재 여행을 바꿉니다. 필요한 내용은 백업했나요?'))return;await importLocalState(incoming);notify('기기에 가져왔습니다.');}catch(error){localMessage(error.message);}finally{e.target.value='';}};
window.addEventListener('pagehide',()=>{if(dirty)rememberLocalDraft();});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty){rememberLocalDraft();save();}});
function installationHelp(){const installed=window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone;$('#appToolsBody').innerHTML=`<p>${installed?'홈 화면 앱으로 실행 중입니다.':'웹에서도 사용할 수 있고 홈 화면에 앱으로 추가할 수 있습니다.'}</p><p>iPhone: Safari 공유 → 홈 화면에 추가<br>Android: 브라우저 메뉴 → 앱 설치</p><p>여행은 이 기기에 저장됩니다. 다른 기기에는 백업 파일을 가져오세요. 기기 간 자동 동기화는 사용하지 않습니다.</p><p>브라우저 데이터를 삭제하기 전에는 백업을 보관하세요.</p><div class="actions"><button id="toolsExport">여행 백업</button><button id="toolsImport">백업 가져오기</button>${installPrompt?'<button id="promptInstall" class="primary">앱 설치</button>':''}${pwaWaiting?'<button id="applyAppUpdate">새 버전 적용</button>':''}</div>`;$('#toolsExport').onclick=()=>$('#exportBtn').click();$('#toolsImport').onclick=()=>{$('#appTools').close();$('#importFile').click();};if(installPrompt)$('#promptInstall').onclick=async()=>{await installPrompt.prompt();installPrompt=null;};if(pwaWaiting)$('#applyAppUpdate').onclick=async()=>{if(dirty){await save();if(dirty){notify('저장을 마친 뒤 새 버전을 적용해 주세요.');return;}}sessionStorage.setItem('ridebook-update','1');pwaWaiting.postMessage({type:'ACTIVATE'});};$('#appTools').showModal();}
$('#installApp').onclick=installationHelp;$('#closeAppTools').onclick=()=>$('#appTools').close();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
if('serviceWorker' in navigator){navigator.serviceWorker.register('/ridebook/sw.js',{scope:'/ridebook/',updateViaCache:'none'}).then(async reg=>{
 const showWaiting=()=>{if(reg.waiting){pwaWaiting=reg.waiting;$('#offlineStatus').textContent='새 버전 있음 · 앱 메뉴에서 적용';}};showWaiting();reg.addEventListener('updatefound',()=>{reg.installing?.addEventListener('statechange',showWaiting);});
 await navigator.serviceWorker.ready;$('#offlineStatus').textContent='오프라인 준비 완료';showWaiting();navigator.storage?.persist?.().catch(()=>{});
 }).catch(()=>{$('#offlineStatus').textContent='오프라인 준비 실패 · 온라인에서 다시 열기';});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(sessionStorage.getItem('ridebook-update')){sessionStorage.removeItem('ridebook-update');location.reload();}});}
else $('#offlineStatus').textContent='이 브라우저는 온라인으로 사용하세요';
const localMore=openMore;openMore=function(){localMore();$('#moreBody').insertAdjacentHTML('beforeend','<button id="localAppSettings">설치 · 기기 저장 안내</button>');$('#localAppSettings').onclick=()=>{$('#moreDialog').close();installationHelp();};};$('#moreBtn').onclick=openMore;
const localNotes=views.notes;views.notes=()=>localNotes().replace('논의할 내용과 참고 자료를 모아 둡니다.','메모와 참고 자료 · 이 기기에 자동 저장').replace('입력한 내용은 자동 저장됩니다. 동기화 상태는 상단에서 확인하세요.','입력한 내용은 이 기기에 자동 저장됩니다.').replace('Chrome 또는 Safari에서 로그인 후 공유 메뉴의 ‘홈 화면에 추가’를 선택하세요. 인터넷 연결과 본인 계정 로그인이 필요합니다.','공유 메뉴의 ‘홈 화면에 추가’를 선택하세요. 오프라인 준비 완료 후에는 인터넷 없이 여행 정보를 확인할 수 있습니다.').replace('다른 기기에서는 같은 주소로 접속하세요.','다른 기기에서는 같은 주소를 열고 백업 파일을 가져오세요.');

load();
</script></body></html>
