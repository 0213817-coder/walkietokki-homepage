name: Travel checks
on:
  pull_request:
    paths:
      - 'functions/travel/**'
      - 'travel-app/**'
      - 'tests/*.test.mjs'
      - 'scripts/build-travel.mjs'
      - 'public/ridebook/**'
      - 'public/_headers'
      - 'public/_routes.json'
      - '.github/workflows/travel-checks.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/build-travel.mjs
      - run: node --test tests/*.test.mjs
      - run: npm ci
      - run: npm run build
