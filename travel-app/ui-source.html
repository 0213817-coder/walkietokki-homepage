ype="button" id="cancelDialog">취소</button><button type="submit" class="primary">적용</button></div></form></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>

const title=(a,b,button='')=>`<div class="section-head"><div><h1 class="page-title">${a}</h1><p class="sub">${b}</p></div>${button}</div>`;
const edit=(type,id)=>`<button data-edit="${type}" data-id="${esc(id)}">수정</button>`;

const views={
home(){const packed=data.packing.filter(p=>p.done).length;return `<section class="hero"><svg viewBox="0 0 650 300" aria-hidden="true"><circle cx="480" cy="76" r="34" fill="#dbe8b9"/><path d="M0 300L180 62L300 217L390 130L600 300" fill="#517966"/><path d="M230 300L440 107L650 280V300" fill="#799778"/><path d="M0 300Q160 200 320 270T650 280V300" fill="#294f42"/><path d="M300 300Q470 270 410 240T520 202" fill="none" stroke="#c7dba5" stroke-width="3" stroke-dasharray="6 8"/></svg><div class="text"><div class="eyebrow">MY TRAVEL JOURNAL</div><h1>다시, 치앙마이.</h1><p>${esc(data.trip.note)}</p><span class="pill">${esc(data.trip.start)} — ${esc(data.trip.end)}</span></div></section><div class="quick">${[['flights','✈','항공권','왕복 예약 확인'],['hotels','▤','숙소','예약·체크인'],['places','♧','식당·장소',data.places.length+'개의 저장 장소'],['routes','↗','라이딩 코스','리커버리 · 평지 · 산악'],['days','▦','여행 일정',''+data.days.length+'일의 여행 노트'],['packing','✓','준비물',packed+'/'+data.packing.length+' 완료']].map(([v,i,n,s])=>`<button data-go="${v}"><b>${i}</b><strong>${n}</strong><small>${s}</small></button>`).join('')}</div><div class="notice">${esc(data.trip.departureNotice||'항공 시각은 각 공항 현지시각입니다.')}</div><div class="section-head"><h2>항공 예약</h2><button class="linkbtn" data-go="flights">전체보기</button></div><div class="grid two">${data.flights.map(flightCard).join('')}</div><div class="section-head"><h2>여행 관리</h2><button class="linkbtn" data-go="notes">메모</button></div><div class="grid"><div class="card"><span class="eyebrow">01 · STAY</span><h3>숙소 예약</h3><p>${esc(data.hotels[0]?.name||'숙소 추가')}<br>늦은 도착일 체크인과 마지막 날 짐 보관을 함께 확인합니다.</p><button data-go="hotels">숙소 관리</button></div><div class="card"><span class="eyebrow">02 · RIDE</span><h3>라이딩 기록</h3><p>목적에 맞는 코스를 고르고 거리와 획득고도를 비교하세요. 지도와 고도표는 코스 상세에서 확인할 수 있습니다.</p><button data-go="routes">코스</button></div><div class="card"><span class="eyebrow">03 · READY</span><h3>출발 준비 ${packed}/${data.packing.length}</h3><progress max="${data.packing.length}" value="${packed}"></progress><p>이전 여행의 체크 여부는 초기화했습니다. 이번 여행 준비를 새로 체크하세요.</p><button data-go="packing">준비물</button></div></div><p class="message">변경 내용은 자동 저장됩니다. ‘동기화 완료’ 후 다른 기기에서도 이어집니다. 기존 메모의 휴무·영업정보는 현재 정보와 다를 수 있습니다.</p>`},
flights(){return title('항공권','예약 원본 및 본인 확인 내용 / 시각은 각 공항 현지시각')+`<div class="grid two">${data.flights.map(flightCard).join('')}</div><div class="notice">좌석 예약 완료 · 좌석번호만 추가하면 됩니다. 자전거 운송과 수하물 중량은 출국 전 확인하세요.</div>`},
hotels(){return title('숙소','예약 원본과 체크인·체크아웃을 한곳에',add('hotels'))+`<div class="grid two">${data.hotels.map(h=>`<article class="card">${badge(h.checkin?'예약 정보':'확인 필요')}<h3>${esc(h.name)}</h3><p>체크인 ${esc(h.checkin||'미정')}<br>체크아웃 ${esc(h.checkout||'미정')}</p><p>${esc(h.address)}</p><details><summary>예약번호</summary>${esc(h.reference||'미등록')}</details><p>${esc(h.note)}</p><div class="actions">${h.address?ext(map(h.address),'지도 검색'):''}${ext(h.url,'예약 원본')}${edit('hotels',h.id)}</div></article>`).join('')}</div>`},
places(){return title('먹고, 쉬고, 둘러보고','이전 메모와 2025 계획에서 모은 장소 · 지도는 검색 링크입니다',add('places'))+`<div class="filters"><input id="search" aria-label="장소 검색" placeholder="식당 이름, 지역, 메뉴 검색" value="${esc(query)}">${['전체','식당','카페','마사지','관광','즐겨찾기'].map(t=>`<button data-filter="${t}" class="${filter===t?'selected':''}">${t}</button>`).join('')}</div><div id="results" class="grid">${placeResults()}</div>`},
routes(){return title('다시 달리고 싶은 길','계획 경로는 완주 기록이 아닙니다. 실제 기록은 주행일·표시 거리 기준. 상승고도와 개별 활동 지도는 추가 확인이 필요합니다.',add('routes'))+`<div class="filters"><input id="search" aria-label="코스 검색" placeholder="코스·연도 검색" value="${esc(query)}">${['전체','실제 주행','계획 경로','추천 후보','즐겨찾기'].map(t=>`<button data-filter="${t}" class="${filter===t?'selected':''}">${t}</button>`).join('')}</div><div id="results" class="grid">${routeResults()}</div>`},
days(){const d=data.days.find(d=>d.date===selectedDate)||data.days[0];selectedDate=d.date;return title('일정','항공·이동은 확정 정보, 나머지는 함께 수정할 초안입니다.')+`<div class="date-strip">${data.days.map(x=>`<button data-date="${x.date}" class="${x.date===d.date?'active':''}"><small>${x.date.slice(5,7)}월</small><strong>${x.date.slice(8)}</strong>${new Date(x.date+'T12:00:00').toLocaleDateString('ko-KR',{weekday:'short'})}</button>`).join('')}</div><div class="daylayout"><article class="card">${badge(d.status)}<h2>${esc(d.date)}</h2>${[['오전 · 라이딩',d.morning],['오후 · 휴식',d.afternoon],['저녁 · 식사',d.dinner]].map(([l,v])=>`<div class="schedule-row"><b>${l}</b><span>${esc(v||'미정')}</span></div>`).join('')}<p>${esc(d.note)}</p><div class="actions">${edit('days',d.id)}</div></article><article class="card"><span class="eyebrow">A GOOD DAY IN CHIANG MAI</span><h3>달리고, 먹고, 쉬는 리듬</h3><p>2025년 계획의 기본 흐름<br>06:00 기상·조식<br>07:00–12:00 라이딩<br>14:00–15:00 낮잠<br>16:00–21:00 관광·저녁<br>22:00 취침</p><p>올해 제안: 강한 라이딩 다음 날에는 회복 라이딩 또는 휴식. 코스와 저녁 식당은 숙소 위치를 보고 묶어 정합니다.</p><div class="actions"><button data-go="routes">코스</button><button data-go="places">식당·장소</button></div></article></div>`},
packing(){const n=data.packing.filter(p=>p.done).length;return title('준비물','이번 여행의 준비 상태 · 변경 내용 자동 저장',add('packing'))+`<div class="card"><div class="stats"><div><b>${n}</b><span>준비 완료</span></div><div><b>${data.packing.length-n}</b><span>남은 준비물</span></div></div><progress value="${n}" max="${data.packing.length}"></progress><div class="checklist">${data.packing.map(p=>`<label class="check ${p.done?'done':''}"><input type="checkbox" data-check="${esc(p.id)}" ${p.done?'checked':''}><span>${esc(p.name)}</span></label>`).join('')}</div></div>`},
notes(){return title('메모','논의할 내용과 참고 자료를 모아 둡니다.')+`<div class="grid two"><div class="card"><h3>메모</h3><label>메모<textarea id="notes" rows="15">${esc(data.notes)}</textarea></label><p>입력한 내용은 자동 저장됩니다. 동기화 상태는 상단에서 확인하세요.</p></div><div class="card"><h3>참고 자료</h3><div class="source-list">${data.sources.map(s=>ext(s.url,s.name)).join('')}</div><h3>아이폰에서 쉽게 열기</h3><p>Chrome 또는 Safari에서 로그인 후 공유 메뉴의 ‘홈 화면에 추가’를 선택하세요. 인터넷 연결과 본인 계정 로그인이 필요합니다.</p><h3>내 기록 보관</h3><p>상단 백업은 현재 내용을 JSON 파일로 내려받습니다. 다른 기기에서는 같은 주소로 접속하세요.</p></div></div>`}
};
function placeResults(){let arr=data.places.filter(p=>(filter==='전체'||(filter==='즐겨찾기'?p.favorite:p.kind===filter))&&JSON.stringify(p).toLowerCase().includes(query.toLowerCase()));return arr.map(p=>`<article class="card ${p.favorite?'saved-item':''}"><div>${badge(p.kind)} ${badge(p.area)}</div><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p><div class="label">${esc(p.source)}</div><div class="actions"><button data-fav="places" data-id="${esc(p.id)}" aria-label="${esc(p.name)} 즐겨찾기" aria-pressed="${!!p.favorite}" class="${p.favorite?'favorite':''}">${p.favorite?'★':'☆'}</button>${ext(p.url||map(p.name),'지도·정보')}<button data-visit="${esc(p.id)}">${p.visited?'✓ 방문함':'방문 체크'}</button>${edit('places',p.id)}</div></article>`).join('')||'<div class="empty">조건에 맞는 장소가 없습니다.</div>'}
function routeResults(){let arr=data.routes.filter(r=>(filter==='전체'||(filter==='즐겨찾기'?r.favorite:r.type===filter))&&JSON.stringify(r).toLowerCase().includes(query.toLowerCase()));return arr.map(r=>`<article class="card ${r.favorite?'saved-item':''}">${badge(r.type)} <span class="label">${esc(r.year)}</span><h3>${esc(r.name)}</h3><div class="route-stats"><div><strong>${esc(r.distance||'—')}</strong><small>거리 km</small></div><div><strong>${esc(r.elevation||'—')}</strong><small>상승고도 m</small></div></div><p>${esc(r.note)}</p><div class="actions"><button data-fav="routes" data-id="${esc(r.id)}" aria-label="${esc(r.name)} 즐겨찾기" aria-pressed="${!!r.favorite}">${r.favorite?'★':'☆'}</button>${ext(r.url,r.type==='실제 주행'?'훈련 로그 (개별 코스 아님)':'코스 원본')}${edit('routes',r.id)}</div></article>`).join('')||'<div class="empty">조건에 맞는 코스가 없습니다.</div>'}
const schemas={flights:[['name','편명'],['departure','출발 · 현지시각'],['arrival','도착 · 현지시각'],['reference','예약번호'],['url','원본 링크','url'],['note','메모','textarea']],hotels:[['name','숙소명'],['checkin','체크인','date'],['checkout','체크아웃','date'],['address','주소'],['reference','예약번호'],['url','예약 원본 링크','url'],['note','메모','textarea']],places:[['name','장소명'],['kind','분류','select','식당,카페,마사지,관광'],['area','지역'],['source','출처'],['url','지도 또는 공식 링크','url'],['note','메모','textarea']],routes:[['name','코스명'],['type','종류','select','계획 경로,실제 주행,추천 후보'],['year','연도 또는 주행일'],['distance','거리 km'],['elevation','상승고도 m'],['url','스트라바·코스 링크','url'],['note','메모','textarea']],days:[['morning','오전·라이딩'],['afternoon','오후·휴식'],['dinner','저녁·식사'],['status','상태','select','미정,제안,확정,항공 확정,이동 준비'],['note','메모','textarea']],packing:[['name','준비물']]};
function openEditor(type,id){const obj=id?data[type].find(x=>x.id===id):{};editContext={type,id};$('#dialogTitle').textContent=id?'여행 정보 수정':'여행 정보 추가';$('#fields').innerHTML=schemas[type].map(([key,label,kind,opts])=>`<label class="${kind==='textarea'?'full':''}">${label}${kind==='textarea'?`<textarea name="${key}">${esc(obj[key])}</textarea>`:kind==='select'?`<select name="${key}">${opts.split(',').map(o=>`<option ${obj[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${key}" type="${kind||'text'}" value="${esc(obj[key])}" ${key==='name'?'required':''}>`}</label>`).join('');$('#editor').showModal()}
$('#closeDialog').onclick=$('#cancelDialog').onclick=()=>$('#editor').close();$('#editForm').onsubmit=e=>{e.preventDefault();const {type,id}=editContext;const values=Object.fromEntries(new FormData(e.target).entries());if(type==='hotels'&&values.checkin&&values.checkout&&values.checkout<values.checkin){notify('체크아웃 날짜를 확인해 주세요.');return}if(id){Object.assign(data[type].find(x=>x.id===id),values)}else{data[type].push({id:crypto.randomUUID(),favorite:false,visited:false,done:false,...values})}changed();$('#editor').close();render()};
function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>openEditor(e.dataset.edit,e.dataset.id));document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>openEditor(e.dataset.add));document.querySelectorAll('[data-filter]').forEach(e=>e.onclick=()=>{filter=e.dataset.filter;render()});document.querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>{selectedDate=e.dataset.date;render();document.querySelector('.date-strip .active')?.scrollIntoView({block:'nearest',inline:'center'})});document.querySelectorAll('[data-fav]').forEach(e=>e.onclick=()=>{const r=data[e.dataset.fav].find(r=>r.id===e.dataset.id);r.favorite=!r.favorite;changed();render()});document.querySelectorAll('[data-visit]').forEach(e=>e.onclick=()=>{const p=data.places.find(p=>p.id===e.dataset.visit);p.visited=!p.visited;changed();render()});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{data.packing.find(p=>p.id===e.dataset.check).done=e.checked;changed();render()});if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#results').innerHTML=view==='places'?placeResults():routeResults();bindResults()};if($('#notes'))$('#notes').oninput=e=>{data.notes=e.target.value;changed()}}
function bindResults(){document.querySelectorAll('#results [data-edit]').forEach(e=>e.onclick=()=>openEditor(e.dataset.edit,e.dataset.id));document.querySelectorAll('#results [data-fav]').forEach(e=>e.onclick=()=>{const r=data[e.dataset.fav].find(r=>r.id===e.dataset.id);r.favorite=!r.favorite;changed();render()});document.querySelectorAll('#results [data-visit]').forEach(e=>e.onclick=()=>{const p=data.places.find(p=>p.id===e.dataset.visit);p.visited=!p.visited;changed();render()})}
const dayColors={'라이딩':'ride','회복':'recovery','휴식':'rest','이동':'travel'};
function dayLabel(d){return d.rideKind==='라이딩'?(d.intensity==='최고강도'?'55 고강도':'라이딩'):d.rideKind==='회복'?(d.calendarLabel==='적응'?'적응':'회복'):d.rideKind==='휴식'?'휴식':d.calendarLabel||d.rideKind||'미정';}
function calendar(){
 const months=[...new Set(data.days.map(d=>d.date.slice(0,7)))];
 return '<div class="calendar-months">'+months.map(month=>{
  const first=new Date(month+'-01T12:00:00Z'),offset=(first.getUTCDay()+6)%7;
  const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
  return `<section class="card month"><h2>${esc(month.replace('-','년 '))}월</h2><div class="calendar-grid">${['월','화','수','목','금','토','일'].map(n=>`<span class="weekday">${n}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:last},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0'),d=data.days.find(x=>x.date===date);return d?`<button data-date="${date}" class="calendar-day ${dayColors[d.rideKind]||''} ${d.rideKind==='라이딩'&&d.intensity==='최고강도'?'high-intensity':''} ${selectedDate===date?'chosen':''}" aria-label="${date} ${esc(d.rideKind)} ${esc(d.goal)} ${esc(d.morning)}" aria-pressed="${selectedDate===date}"><b>${i+1}</b><span>${esc(d.rideKind==='라이딩'&&d.intensity==='최고강도'?'55':dayLabel(d))}</span><small>${esc(d.goal||'—')}</small></button>`:`<span class="outside">${i+1}</span>`}).join('')}</div></section>`;
 }).join('')+'</div>';
}
views.days=function(){const d=data.days.find(x=>x.date===selectedDate)||data.days[0];if(!d)return title('여행 캘린더','일정 데이터를 불러와 주세요.');selectedDate=d.date;const r=data.routes.find(r=>r.id===d.routeId);return title('일정','날짜별 라이딩·휴식 일정 · 거리 단위 km')+`<p class="schedule-rule">${esc(data.trip.scheduleRule||'날짜를 눌러 라이딩과 휴식 계획을 편집하세요.')}</p><div class="legend">${Object.entries(dayColors).map(([name,cls])=>`<span class="${cls}">${name} ${data.days.filter(x=>x.rideKind===name).length}일</span>`).join('')}</div>${calendar()}<div class="notice">거리는 계획 목표입니다. 실제 경로의 거리·상승고도는 출발 전 확인하고, 컨디션이 나쁘면 휴식으로 바꾸세요.</div><article class="card" id="day-detail"><div class="section-head"><h2>${esc(d.date)} · ${esc(dayLabel(d))}</h2>${edit('days',d.id)}</div>${badge(d.status)} ${d.goal?badge('목표 '+d.goal+' km'):''}${[['오전',d.morning],['오후',d.afternoon],['저녁',d.dinner]].map(([k,v])=>`<div class="schedule-row"><b>${k}</b><span>${esc(v||'미정')}</span></div>`).join('')}<p>${esc(d.note)}</p><div class="actions">${r&&/^https:\/\/www.strava.com\/routes\//.test(r.url)?ext(r.url,r.name+' · Strava 코스'):(d.rideKind==='라이딩'?'<span class="accent">연결된 코스 없음</span>':'')}<button data-go="routes">전체 코스</button><button data-go="places">식당·장소</button></div></article>`};
const oldPacking=views.packing;
const bangkokDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
views.packing=function(){const today=bangkokDate(),done=data.chargeLog?.[today]||{};return oldPacking()+`<div class="section-head"><h2>충전 체크리스트</h2></div><div class="card"><p>${esc(today)} · 치앙마이 현지 날짜 기준. 다음 날 새 체크 목록이 열리고 이전 기록은 백업에 남습니다. 잔량이 충분하면 확인만 체크해도 됩니다.</p><div class="checklist">${(data.chargingItems||[]).map((name,i)=>`<label class="check"><input type="checkbox" data-charge="${i}" ${done[i]?'checked':''}><span>${esc(name)}</span></label>`).join('')}</div></div><div class="section-head"><h2>전기 · 케이블 · 국내 문자</h2></div><div class="grid two">${(data.preparation||[]).map(p=>`<article class="card"><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p></article>`).join('')}</div><p class="message">제품별 정확한 모델과 단자를 최종 확인하세요. 공식 근거는 ‘메모 → 참고 자료’에 모았습니다.</p>`};

const oldBind=bind;
bind=function(){oldBind();document.querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>{selectedDate=e.dataset.date;view='days';history.replaceState(null,'','#days');render();$('#day-detail')?.scrollIntoView({block:'nearest',behavior:'smooth'})});document.querySelectorAll('[data-charge]').forEach(e=>e.onchange=()=>{const today=bangkokDate();data.chargeLog??={};data.chargeLog[today]??={};data.chargeLog[today][e.dataset.charge]=e.checked;changed()});};
schemas.days.unshift(['rideKind','하루 유형','select','라이딩,회복,휴식,이동'],['goal','목표 거리 (예: 80–95)'],['intensity','라이딩 강도','select','일반,가볍게,최고강도']);
const oldEditor=openEditor;
openEditor=function(type,id){oldEditor(type,id);if(type==='days'){const current=data.days.find(d=>d.id===id);$('#fields').insertAdjacentHTML('beforeend',`<label class="full">Strava 코스 연결<select name="routeId"><option value="">미연결</option>${data.routes.filter(r=>r.type!=='실제 주행').map(r=>`<option value="${esc(r.id)}" ${current?.routeId===r.id?'selected':''}>${esc(r.name)}${/^https:\/\/www.strava.com\/routes\//.test(r.url)?'':' · 링크 없음'}</option>`).join('')}</select></label>`)}};

const collections=['flights','hotels','places','routes','days','packing'];
function validState(x){
 if(!x||typeof x!=='object'||!x.trip||typeof x.trip!=='object'||typeof x.notes!=='string'||!Array.isArray(x.sources)||x.sources.some(s=>!s||typeof s.name!=='string'||typeof s.url!=='string'))return false;
 for(const k of collections){
  if(!Array.isArray(x[k])||x[k].length>2000)return false;
  const ids=new Set();for(const item of x[k]){if(!item||typeof item.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(item.id)||ids.has(item.id))return false;ids.add(item.id);}
 }
 if(!x.days.length||x.days.some(d=>typeof d.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||Number.isNaN(Date.parse(d.date))))return false;
 for(const f of x.flights){if(f.baggagePieces!==undefined&&f.baggagePieces!==''&&(!/^\d{1,2}$/.test(String(f.baggagePieces))||Number(f.baggagePieces)>20))return false;}
 for(const r of x.routes){
  if(r.geometry!==undefined&&(!Array.isArray(r.geometry)||r.geometry.length>50||r.geometry.some(s=>!Array.isArray(s)||s.length>1200||s.some(p=>!Array.isArray(p)||p.length!==2||!Number.isFinite(p[0])||!Number.isFinite(p[1])||Math.abs(p[0])>90||Math.abs(p[1])>180))||r.geometry.reduce((n,s)=>n+s.length,0)>1200))return false;
  if(r.profile!==undefined&&(!Array.isArray(r.profile)||r.profile.length>400||r.profile.some(p=>!Array.isArray(p)||p.length!==2||p.some(n=>!Number.isFinite(n)))))return false;
 }
 if(x.preparation!==undefined&&(!Array.isArray(x.preparation)||x.preparation.some(p=>!p||typeof p.title!=='string'||typeof p.body!=='string')))return false;
 if(x.chargingItems!==undefined&&(!Array.isArray(x.chargingItems)||x.chargingItems.some(i=>typeof i!=='string')))return false;
 if(x.chargeLog!==undefined&&(!x.chargeLog||typeof x.chargeLog!=='object'||Array.isArray(x.chargeLog)||Object.entries(x.chargeLog).some(([day,items])=>!/^\d{4}-\d{2}-\d{2}$/.test(day)||!items||typeof items!=='object'||Object.entries(items).some(([key,val])=>!/^\d+$/.test(key)||typeof val!=='boolean'))))return false;
 return true;
}
